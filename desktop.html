<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room 3D Walkthrough</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #fff; font-family: 'Courier New', monospace; overflow: hidden; }
  #canvas { display: block; }
  #ui {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
  }
  #controls-panel {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(10,10,20,0.85); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px; padding: 14px 22px; display: flex; gap: 24px;
    align-items: center; font-size: 12px; color: rgba(255,255,255,0.7);
    pointer-events: none; backdrop-filter: blur(10px);
  }
  .ctrl-group { display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .ctrl-keys { display: flex; gap: 4px; }
  .key {
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
    border-radius: 4px; padding: 3px 7px; font-size: 11px; font-weight: bold; color: #fff;
  }
  .ctrl-label { font-size: 10px; color: rgba(255,255,255,0.45); }
  #mode-panel {
    position: fixed; top: 20px; right: 20px;
    display: flex; flex-direction: column; gap: 8px; pointer-events: all;
  }
  .mode-btn {
    background: rgba(10,10,20,0.85); border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.65); padding: 7px 14px; border-radius: 8px;
    font-family: 'Courier New', monospace; font-size: 11px; cursor: pointer;
    transition: all 0.18s; backdrop-filter: blur(10px);
    display: flex; align-items: center; gap: 7px; letter-spacing: 0.3px;
  }
  .mode-btn svg { opacity: 0.7; flex-shrink: 0; transition: opacity 0.18s; }
  .mode-btn:hover, .mode-btn.active {
    background: rgba(80,130,220,0.18); border-color: rgba(100,160,255,0.45);
    color: #fff;
  }
  .mode-btn:hover svg, .mode-btn.active svg { opacity: 1; }
  #info-panel {
    position: fixed; top: 20px; left: 20px;
    background: rgba(10,10,20,0.85); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px; padding: 14px 18px; backdrop-filter: blur(10px);
    pointer-events: none; min-width: 180px;
  }
  #info-panel h3 { font-size: 13px; color: rgba(100,180,255,0.9); margin-bottom: 8px; letter-spacing: 2px; text-transform: uppercase; }
  #info-panel p { font-size: 11px; color: rgba(255,255,255,0.5); line-height: 1.6; }
  #selected-info {
    position: fixed; top: 50%; right: 20px; transform: translateY(-50%);
    background: rgba(10,10,20,0.9); border: 1px solid rgba(100,200,100,0.3);
    border-radius: 10px; padding: 14px 18px; backdrop-filter: blur(10px);
    pointer-events: none; display: none; min-width: 160px;
  }
  #selected-info h4 { font-size: 12px; color: rgba(100,220,100,0.9); margin-bottom: 6px; }
  #selected-info p { font-size: 11px; color: rgba(255,255,255,0.5); line-height: 1.7; }
  #crosshair {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 20px; height: 20px; pointer-events: none;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: rgba(255,255,255,0.6);
  }
  #crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
  #crosshair::after { height: 2px; width: 100%; top: 50%; transform: translateY(-50%); }
  #drag-hint {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, calc(-50% - 40px));
    background: rgba(255,200,50,0.15); border: 1px solid rgba(255,200,50,0.4);
    color: rgba(255,200,50,0.9); padding: 6px 14px; border-radius: 20px;
    font-size: 11px; pointer-events: none; display: none;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
  <div id="info-panel">
    <h3>🏠 Room Tour</h3>
    <p>150.69 × 109.22 inches<br>12'6.69" × 9'1.22" ft</p>
    <p style="margin-top:8px; color:rgba(255,255,255,0.35)">Mode: <span id="mode-label">Walk</span></p>
  </div>

  <div id="mode-panel">
    <button class="mode-btn active" id="btn-walk" onclick="setMode('walk')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><path d="M12 7v6l-3 4"/><path d="M12 13l3 4"/><path d="M9 11H7"/><path d="M17 11h-2"/></svg>
      Walk
    </button>
    <button class="mode-btn" id="btn-orbit" onclick="setMode('orbit')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-30 12 12)"/></svg>
      Orbit
    </button>
    <button class="mode-btn" id="btn-move" onclick="setMode('move')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
      Move
    </button>
    <button class="mode-btn" id="btn-top" onclick="setMode('top')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
      Top
    </button>
  </div>

  <div id="selected-info">
    <h4 id="sel-name">Desk</h4>
    <p id="sel-dims"></p>
    <p style="margin-top:6px;color:rgba(100,220,100,0.7);font-size:10px" id="sel-hint">Click+Drag to move<br>in Move Mode</p>
  </div>

  <div id="crosshair"></div>
  <div id="drag-hint">Drag furniture or doors to reposition</div>

  <div id="controls-panel">
    <div class="ctrl-group">
      <div class="ctrl-keys">
        <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>
      </div>
      <span class="ctrl-label">Move</span>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-keys"><span class="key">Mouse</span></div>
      <span class="ctrl-label">Look / Orbit</span>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-keys"><span class="key">↑</span><span class="key">↓</span></div>
      <span class="ctrl-label">Fly Up/Down</span>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-keys"><span class="key">Shift</span></div>
      <span class="ctrl-label">Sprint</span>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-keys"><span class="key">R</span></div>
      <span class="ctrl-label">Reset Camera</span>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── CONSTANTS (inches → Three.js units, 1 unit = 1 inch) ──────────────────
const IN = 1;
const ROOM_W = 150.69 * IN;  // 12ft 6.69in
const ROOM_D = 109.22 * IN;  // 9ft 1.22in
const ROOM_H = 96 * IN;
const WALL_T = 4;

// ── SCENE SETUP ──────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 200, 600);

const camera = new THREE.PerspectiveCamera(70, 1, 0.5, 2000);

function resizeRenderer() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
resizeRenderer();
window.addEventListener('resize', resizeRenderer);

// ── MATERIALS ────────────────────────────────────────────────────────────────
const mats = {
  floor:    new THREE.MeshStandardMaterial({ color: 0xc8a96e, roughness: 0.7, metalness: 0.0 }),
  ceiling:  new THREE.MeshStandardMaterial({ color: 0xfafaf8, roughness: 1.0 }),
  desk:     new THREE.MeshStandardMaterial({ color: 0x8b6f47, roughness: 0.5, metalness: 0.1 }),
  deskLeg:  new THREE.MeshStandardMaterial({ color: 0x5c4a3a, roughness: 0.6 }),
  bed:      new THREE.MeshStandardMaterial({ color: 0x5c7a9e, roughness: 0.8 }),
  bedFrame: new THREE.MeshStandardMaterial({ color: 0x3d2b1f, roughness: 0.6 }),
  pillow:   new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 1.0 }),
  closet:   new THREE.MeshStandardMaterial({ color: 0xd4b896, roughness: 0.6 }),
  door:     new THREE.MeshStandardMaterial({ color: 0xe8ddd0, roughness: 0.5 }),
  doorKnob: new THREE.MeshStandardMaterial({ color: 0xd4a843, metalness: 0.9, roughness: 0.1 }),
  trim:     new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8 }),
  selected: new THREE.MeshStandardMaterial({ color: 0x88ddff, roughness: 0.5, metalness: 0.2, emissive: 0x224488 }),
};

// ── WALL SHADER MATERIAL ──────────────────────────────────────────────────────
// Single material, double-sided. gl_FrontFacing = true means camera sees the
// ── WALL MATERIALS ────────────────────────────────────────────────────────────
// Two-pass approach to avoid depth/transparency artifacts:
//   Pass 1 — FrontSide, fully opaque  → interior face looks solid from inside
//   Pass 2 — BackSide,  semi-transparent, higher renderOrder → exterior ghost from outside
const wallMatInner = new THREE.MeshStandardMaterial({
  color: 0xf0ece4, roughness: 0.9, metalness: 0.0,
  side: THREE.FrontSide,
});
const wallMatOuter = new THREE.MeshStandardMaterial({
  color: 0xdedad4, roughness: 0.9, metalness: 0.0,
  side: THREE.BackSide,
  transparent: true, opacity: 0.18,
  depthWrite: false,
});
mats.wall = wallMatInner; // fallback alias

// ── HELPERS ──────────────────────────────────────────────────────────────────
function box(w, h, d, mat, castShadow=true, receiveShadow=true) {
  const g = new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Mesh(g, mat);
  m.castShadow = castShadow;
  m.receiveShadow = receiveShadow;
  return m;
}

// Wall helper — shares one geometry, two meshes in a group
function wallBox(w, h, d) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const grp = new THREE.Group();

  // Inner mesh — opaque, writes depth, renders first
  const inner = new THREE.Mesh(geo, wallMatInner);
  inner.castShadow = true;
  inner.receiveShadow = true;
  inner.renderOrder = 0;
  grp.add(inner);

  // Outer mesh — transparent ghost, does NOT write depth, renders after
  const outer = new THREE.Mesh(geo, wallMatOuter);
  outer.castShadow = false;
  outer.receiveShadow = false;
  outer.renderOrder = 1;
  grp.add(outer);

  return grp;
}

// ── ROOM STRUCTURE ────────────────────────────────────────────────────────────
const roomGroup = new THREE.Group();
scene.add(roomGroup);

// Floor
const floor = box(ROOM_W, WALL_T, ROOM_D, mats.floor, false, true);
floor.position.set(ROOM_W/2, -WALL_T/2, ROOM_D/2);
roomGroup.add(floor);

// Ceiling removed for open-top view

// Back wall (z=0) — fully solid, no door
const wBack = wallBox(ROOM_W, ROOM_H, WALL_T);
wBack.position.set(ROOM_W/2, ROOM_H/2, -WALL_T/2);
roomGroup.add(wBack);

// Front wall (z=ROOM_D)
// Bottom door: x = 20.47..49.47 (2ft5in = 29" wide, starts at closet edge x=20.47)
const DOOR_B_X = 28.47; // 8" gap from closet edge
const DOOR_B_W = 29;    // 2ft 5in
const wFrontLeft = wallBox(DOOR_B_X, ROOM_H, WALL_T);
wFrontLeft.position.set(DOOR_B_X/2, ROOM_H/2, ROOM_D + WALL_T/2);
roomGroup.add(wFrontLeft);
const wFrontRight = wallBox(ROOM_W - DOOR_B_X - DOOR_B_W, ROOM_H, WALL_T);
wFrontRight.position.set(DOOR_B_X + DOOR_B_W + (ROOM_W - DOOR_B_X - DOOR_B_W)/2, ROOM_H/2, ROOM_D + WALL_T/2);
roomGroup.add(wFrontRight);
const wFrontAboveDoor = wallBox(DOOR_B_W, ROOM_H - 84, WALL_T);
wFrontAboveDoor.position.set(DOOR_B_X + DOOR_B_W/2, 84 + (ROOM_H-84)/2, ROOM_D + WALL_T/2);
roomGroup.add(wFrontAboveDoor);

// Left wall (x=0) — full height, closet is built in front of it
const wLeft = wallBox(WALL_T, ROOM_H, ROOM_D);
wLeft.position.set(-WALL_T/2, ROOM_H/2, ROOM_D/2);
roomGroup.add(wLeft);

// Right wall (x=ROOM_W) — door shifted 10" toward bed (z=10..40)
const DOOR_R_W = 30;
const DOOR_R_OFFSET = 10; // shift toward bed
const wRightCorner = wallBox(WALL_T, ROOM_H, DOOR_R_OFFSET);
wRightCorner.position.set(ROOM_W + WALL_T/2, ROOM_H/2, DOOR_R_OFFSET/2);
roomGroup.add(wRightCorner);
const wRightMain = wallBox(WALL_T, ROOM_H, ROOM_D - DOOR_R_OFFSET - DOOR_R_W);
wRightMain.position.set(ROOM_W + WALL_T/2, ROOM_H/2, DOOR_R_OFFSET + DOOR_R_W + (ROOM_D - DOOR_R_OFFSET - DOOR_R_W)/2);
roomGroup.add(wRightMain);
const wRightAboveDoor = wallBox(WALL_T, ROOM_H - 84, DOOR_R_W);
wRightAboveDoor.position.set(ROOM_W + WALL_T/2, 84 + (ROOM_H-84)/2, DOOR_R_OFFSET + DOOR_R_W/2);
roomGroup.add(wRightAboveDoor);

// Floor trim / baseboard
function baseboard(w, d, x, z) {
  const b = box(w, 4, d, mats.trim);
  b.position.set(x, 2, z);
  roomGroup.add(b);
}
baseboard(ROOM_W, 2, ROOM_W/2, 1);          // back
baseboard(ROOM_W, 2, ROOM_W/2, ROOM_D - 1); // front
baseboard(2, ROOM_D, 1, ROOM_D/2);          // left
baseboard(2, ROOM_D, ROOM_W - 1, ROOM_D/2); // right

// Closet is inset in left wall — open face toward room, no partition wall needed

// ── DOORS — MOVABLE ───────────────────────────────────────────────────────────
// Each door lives on a wall. When dragged in Move Mode it slides along its wall.
// Wall segments rebuild whenever a door moves.

const movableObjects = []; // furniture + doors share the drag system

// Door state: { group, arcMesh, wall:'back'|'front'|'left'|'right', pos: offset along wall, width }
const doorStates = [];

// Wall segment groups — rebuilt on door move
const wallSegs = { back: new THREE.Group(), front: new THREE.Group(), left: new THREE.Group(), right: new THREE.Group() };
Object.values(wallSegs).forEach(g => roomGroup.add(g));

function buildDoorPanel(width) {
  const dg = new THREE.Group();
  dg.userData.isDoor = true;

  // Main panel
  const dp = box(width, 84, 3, mats.door);
  dp.position.set(width/2, 42, 0);
  dg.add(dp);

  // Recessed panels (4 insets)
  const pw = width * 0.38, ph1 = 28, ph2 = 22;
  [[width*0.27,58],[width*0.73,58],[width*0.27,22],[width*0.73,22]].forEach(([x,y],i) => {
    const di = box(pw, i<2?ph1:ph2, 1.8, new THREE.MeshStandardMaterial({color:0xddd0c4,roughness:0.5}));
    di.position.set(x, y, -1.5); dg.add(di);
  });

  // Door frame (top + sides)
  const frameMat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.7});
  const fTop = box(width+6, 4, 4, frameMat); fTop.position.set(width/2, 86, 0); dg.add(fTop);
  const fL   = box(3, 88, 4, frameMat);       fL.position.set(-1.5,  44, 0);    dg.add(fL);
  const fR   = box(3, 88, 4, frameMat);       fR.position.set(width+1.5, 44, 0); dg.add(fR);

  // Knob — at width*0.18 so it appears on the RIGHT side when the front door faces inward
  const kn = new THREE.Mesh(new THREE.SphereGeometry(2.2,16,10), mats.doorKnob);
  kn.position.set(width*0.18, 38, -3); dg.add(kn);
  const knBack = new THREE.Mesh(new THREE.SphereGeometry(2.2,16,10), mats.doorKnob);
  knBack.position.set(width*0.18, 38, 3); dg.add(knBack);

  // Highlight overlay (shown when selected/hovered)
  dg.userData.highlightable = true;
  return dg;
}

function buildArc(radius, color=0x88aaff) {
  const geo = new THREE.RingGeometry(2, radius, 48, 1, 0, Math.PI/2);
  const mat = new THREE.MeshBasicMaterial({color, opacity:0.25, transparent:true, side:THREE.DoubleSide});
  const m = new THREE.Mesh(geo, mat);
  m.rotation.x = -Math.PI/2;
  scene.add(m);
  return m;
}

// Rebuild wall segments around doors on that wall
function rebuildWall(wall) {
  const seg = wallSegs[wall];
  while (seg.children.length) seg.remove(seg.children[0]);

  const doors = doorStates.filter(d => d.wall === wall);

  // Wall geometry params
  let wallLen, wallZ, wallX, axis;
  if (wall === 'back')  { wallLen = ROOM_W; wallZ = -WALL_T/2; wallX = 0;      axis = 'x'; }
  if (wall === 'front') { wallLen = ROOM_W; wallZ = ROOM_D+WALL_T/2; wallX = 0; axis = 'x'; }
  if (wall === 'left')  { wallLen = ROOM_D; wallZ = 0; wallX = -WALL_T/2;      axis = 'z'; }
  if (wall === 'right') { wallLen = ROOM_D; wallZ = 0; wallX = ROOM_W+WALL_T/2; axis = 'z'; }

  // Sort doors by position
  const sorted = [...doors].sort((a,b) => a.pos - b.pos);

  // Build solid segments between/around door openings
  let cursor = 0;
  const addSeg = (from, to) => {
    const len = to - from;
    if (len < 0.5) return;
    const s = wallBox(
      axis==='x' ? len : WALL_T,
      ROOM_H,
      axis==='z' ? len : WALL_T
    );
    if (axis === 'x') s.position.set(from + len/2, ROOM_H/2, wallZ);
    else              s.position.set(wallX, ROOM_H/2, from + len/2);
    seg.add(s);
  };
  const addAboveDoor = (from, dw) => {
    const transom = wallBox(
      axis==='x' ? dw : WALL_T,
      ROOM_H - 84,
      axis==='z' ? dw : WALL_T
    );
    if (axis==='x') transom.position.set(from+dw/2, 84+(ROOM_H-84)/2, wallZ);
    else            transom.position.set(wallX, 84+(ROOM_H-84)/2, from+dw/2);
    seg.add(transom);
  };

  sorted.forEach(d => {
    addSeg(cursor, d.pos);
    addAboveDoor(d.pos, d.width);
    cursor = d.pos + d.width;
  });
  addSeg(cursor, wallLen);
}

// Position a door group + arc on its wall
function placeDoor(ds) {
  const { group, arcMesh, wall, pos, width } = ds;
  if (wall === 'back') {
    // Panel local +X = world +X. Door fills x=pos..pos+width
    group.position.set(pos, 0, 0);
    group.rotation.y = 0;
    arcMesh.position.set(pos, 0.5, 2);
    arcMesh.rotation.set(-Math.PI/2, 0, 0);
  } else if (wall === 'front') {
    // Rotated 180°: local +X → world -X. Set origin at pos+width so panel extends left to pos
    group.position.set(pos + width, 0, ROOM_D);
    group.rotation.y = Math.PI;
    // Arc swings inward (toward -z), pivot at left jamb (pos)
    arcMesh.position.set(pos, 0.5, ROOM_D - 2);
    arcMesh.rotation.set(-Math.PI/2, 0, Math.PI/2);
  } else if (wall === 'left') {
    // Rotated +90°: local +X → world +Z. Door fills z=pos..pos+width
    group.position.set(0, 0, pos);
    group.rotation.y = Math.PI/2;
    arcMesh.position.set(2, 0.5, pos);
    arcMesh.rotation.set(-Math.PI/2, 0, -Math.PI/2);
  } else if (wall === 'right') {
    // Rotated -90°: local +X → world -Z. Set origin at z=pos+width, panel extends toward z=pos
    group.position.set(ROOM_W, 0, pos + width);
    group.rotation.y = -Math.PI/2;
    // Arc swings inward (toward -x = into room), pivot at z=pos+width corner
    arcMesh.position.set(ROOM_W - 2, 0.5, pos);
    arcMesh.rotation.set(-Math.PI/2, 0, Math.PI);
  }
}

function createDoor(wall, pos, width, arcColor) {
  const group = buildDoorPanel(width);
  scene.add(group);

  const arcMesh = buildArc(width, arcColor);

  const ds = { group, arcMesh, wall, pos, width };
  doorStates.push(ds);
  movableObjects.push({ group, isDoor: true, doorState: ds });

  // Tag all meshes
  group.traverse(child => {
    if (child.isMesh) child.userData.movableRef = movableObjects[movableObjects.length-1];
  });

  placeDoor(ds);
  rebuildWall(wall);
  return ds;
}

// Front wall door
createDoor('front', DOOR_B_X, DOOR_B_W, 0x88ffaa);

// Right wall door — upper-right corner (z=0..30), SHUT (closed in frame, no swing arc)
{
  const dg = new THREE.Group();
  const DW = DOOR_R_W;

  const doorMat    = mats.door;
  const frameMat   = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.7});
  const panelMat   = new THREE.MeshStandardMaterial({color:0xddd0c4, roughness:0.5});
  const muntinMat  = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.5});
  const glassMat   = new THREE.MeshPhysicalMaterial({
    color: 0xd0eeff,
    transparent: true,
    opacity: 0.08,
    roughness: 0.0,
    metalness: 0.0,
    transmission: 0.95,
    side: THREE.DoubleSide,
    depthWrite: false,
  });

  // ── Door panel built in sections, leaving a window opening ───────────────
  // Window opening: y=42..76, z=DW*0.15..DW*0.85
  const winZ0 = DW * 0.15, winZ1 = DW * 0.85, winH0 = 42, winH1 = 76;
  const winZW = winZ1 - winZ0, winH = winH1 - winH0;

  // Bottom solid section (y=0..42)
  const pBot = box(3, winH0, DW, doorMat); pBot.position.set(0, winH0/2, DW/2); dg.add(pBot);

function createCloset() {
  const g = new THREE.Group();
  // Full left wall length: CW=20.47" deep, CH=80.14" tall, CD=ROOM_D long
  const CW = 20.47, CH = 80.14, CD = ROOM_D;
  g.userData = { name: 'Closet', dims: `${CW.toFixed(1)}" deep × full wall`, w: CW, d: CD, fixed: true };

  const woodMat     = mats.closet;
  const interiorMat = new THREE.MeshStandardMaterial({ color: 0xede0d0, roughness: 0.9 });
  const trackMat    = new THREE.MeshStandardMaterial({ color: 0xbbbbbb, metalness: 0.8, roughness: 0.2 });
  const doorMat     = new THREE.MeshStandardMaterial({ color: 0xe8ddd0, roughness: 0.3, metalness: 0.05 });

  // ── Interior shell ───────────────────────────────────────────────────────────
  // Back panel (against left wall)
  const backPanel = box(2, CH, CD, interiorMat);
  backPanel.position.set(CW - 1, CH/2, CD/2);
  g.add(backPanel);

  // Top (ceiling of closet)
  const topPanel = box(CW, 2, CD, woodMat);
  topPanel.position.set(CW/2, CH, CD/2);
  g.add(topPanel);

  // Floor strip
  const floorPanel = box(CW, 1.5, CD, woodMat);
  floorPanel.position.set(CW/2, 0.75, CD/2);
  g.add(floorPanel);

  // End caps (z=0 and z=CD)
  const capBack = box(CW, CH, 2, interiorMat);
  capBack.position.set(CW/2, CH/2, 1);
  g.add(capBack);
  const capFront = box(CW, CH, 2, interiorMat);
  capFront.position.set(CW/2, CH/2, CD - 1);
  g.add(capFront);

  // ── Interior fittings ────────────────────────────────────────────────────────
  // Upper shelf running full length
  const shelf = box(CW - 2, 2, CD - 6, woodMat);
  shelf.position.set(CW/2, CH * 0.82, CD/2);
  g.add(shelf);

  // Hanging rod full length
  const rodGeo = new THREE.CylinderGeometry(0.9, 0.9, CD - 10, 12);
  const rod = new THREE.Mesh(rodGeo, trackMat);
  rod.rotation.x = Math.PI/2;
  rod.position.set(CW/2, CH * 0.72, CD/2);
  g.add(rod);

  // Hanging clothes evenly spaced
  const clothColors = [0x8a6a8a,0x6a8a6a,0x8a8a6a,0x6a6a8a,0x9a6a6a,0x7a8a9a,0xaa8a7a,0x7aaa8a,0x8a9aaa,0xaa9a7a,0x7a8a9a,0x9a7aaa];
  const numClothes = 12;
  for (let i = 0; i < numClothes; i++) {
    const hanger = box(2.5, 20, 1.5, new THREE.MeshStandardMaterial({ color: clothColors[i % clothColors.length], roughness: 0.9 }));
    hanger.position.set(CW * 0.5, CH * 0.58, 8 + i * ((CD - 16) / numClothes));
    g.add(hanger);
  }

  // ── Sliding bypass track doors — 4 panels covering full CD length ────────────
  // Top track rail
  const trackTop = box(3, 3, CD, trackMat);
  trackTop.position.set(CW + 1.5, CH - 1, CD/2);
  g.add(trackTop);
  // Bottom track rail
  const trackBot = box(3, 2.5, CD, trackMat);
  trackBot.position.set(CW + 1.5, 2, CD/2);
  g.add(trackBot);

  // 4 sliding panels — dark woven fabric
  const panelW = CD / 4;
  const tracks = [1, 2.8, 1, 2.8];
  const offsets = [0, 1, 2, 3];
  const fabricMat = new THREE.MeshStandardMaterial({
    color: 0x1e1a18, roughness: 1.0, metalness: 0.0,
    // Simulate woven texture with slight bumpiness via roughness
  });

  offsets.forEach((qi, i) => {
    const zCenter = panelW * qi + panelW / 2;
    const tOff = tracks[i];

    const panel = box(1.8, CH - 6, panelW - 1.5, fabricMat);
    panel.position.set(CW + tOff, CH/2 - 2, zCenter);
    g.add(panel);

    // Vertical frame edges
    const fMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 });
    const fL = box(2, CH - 6, 2, fMat);
    fL.position.set(CW + tOff, CH/2 - 2, panelW * qi + 1.5);
    g.add(fL);
    const fR = box(2, CH - 6, 2, fMat);
    fR.position.set(CW + tOff, CH/2 - 2, panelW * (qi + 1) - 1.5);
    g.add(fR);

    // Horizontal bar handle
    const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 16, 8), trackMat);
    handle.rotation.x = Math.PI / 2;
    handle.position.set(CW + tOff + 1.8, CH * 0.5, zCenter);
    g.add(handle);
  });

  return g;
}

// ── CAMERA STATE ──────────────────────────────────────────────────────────────
let mode = 'walk'; // walk | orbit | move | top
const walkPos = new THREE.Vector3(75, 60, 60);
const walkTarget = new THREE.Vector3(75, 60, 0);
camera.position.copy(walkPos);
camera.lookAt(walkTarget);

// Walk mode state
const keys = {};
let yaw = 0, pitch = 0;
let isPointerLocked = false;

// Orbit mode state
let orbitRadius = 200, orbitTheta = Math.PI/4, orbitPhi = Math.PI/4;
let isOrbiting = false, orbitLast = {x:0, y:0};

// ── POINTER LOCK ─────────────────────────────────────────────────────────────
canvas.addEventListener('click', () => {
  if (mode === 'walk') canvas.requestPointerLock();
});
document.addEventListener('pointerlockchange', () => {
  isPointerLocked = document.pointerLockElement === canvas;
});
document.addEventListener('mousemove', (e) => {
  if (mode === 'walk' && isPointerLocked) {
    yaw   -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;
    pitch = Math.max(-1.2, Math.min(1.2, pitch));
  }
  if (mode === 'orbit' && isOrbiting) {
    orbitTheta -= e.movementX * 0.01;
    orbitPhi   -= e.movementY * 0.01;
    orbitPhi = Math.max(0.05, Math.min(Math.PI/2 - 0.05, orbitPhi));
  }
  if (mode === 'move') handleFurnitureDragMove(e);
});

// Orbit click
canvas.addEventListener('mousedown', (e) => {
  if (mode === 'orbit') { isOrbiting = true; orbitLast = {x:e.clientX, y:e.clientY}; }
  if (mode === 'move') startFurnitureDrag(e);
});
canvas.addEventListener('mouseup', () => {
  isOrbiting = false;
  if (mode === 'move') endFurnitureDrag();
});
canvas.addEventListener('wheel', (e) => {
  if (mode === 'orbit') {
    orbitRadius += e.deltaY * 0.5;
    orbitRadius = Math.max(40, Math.min(400, orbitRadius));
  }
});

document.addEventListener('keydown', (e) => { keys[e.code] = true; });
document.addEventListener('keyup',   (e) => { keys[e.code] = false; });

// Reset
document.addEventListener('keydown', (e) => {
  if (e.code === 'KeyR') resetCamera();
});

function resetCamera() {
  if (mode === 'walk') {
    walkPos.set(65, 60, 60); yaw = 0; pitch = 0;
  }
  if (mode === 'orbit') { orbitRadius = 200; orbitTheta = Math.PI/4; orbitPhi = Math.PI/4; }
}

// ── MODE SWITCHING ────────────────────────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + m).classList.add('active');
  document.getElementById('mode-label').textContent = m.charAt(0).toUpperCase() + m.slice(1);
  document.getElementById('drag-hint').style.display = m === 'move' ? 'block' : 'none';
  document.getElementById('crosshair').style.display = m === 'walk' ? 'block' : 'none';

  if (m === 'walk') {
    camera.position.copy(walkPos);
  }
  if (m === 'top') {
    camera.position.set(ROOM_W/2, 350, ROOM_D/2);
    camera.lookAt(ROOM_W/2, 0, ROOM_D/2);
  }
  if (document.pointerLockElement) document.exitPointerLock();
}

// ── DRAG SYSTEM (furniture + doors) ──────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let dragObject = null;   // { group, isDoor, doorState }
let dragOffset = new THREE.Vector3();
let selectedObject = null;
let hoverHighlight = null;

// All hittable meshes
function getAllMovableMeshes() {
  const meshes = [];
  movableObjects.forEach(mo => {
    mo.group.traverse(child => {
      if (child.isMesh) {
        child.userData.movableRef = mo;
        meshes.push(child);
      }
    });
  });
  // Also add closet as non-draggable but selectable label
  return meshes;
}

const floorPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);

function getMouseNDC(e) {
  mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
}

function startFurnitureDrag(e) {
  getMouseNDC(e);
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(getAllMovableMeshes());
  if (!hits.length) return;

  const mo = hits[0].object.userData.movableRef;
  if (!mo) return;

  dragObject = mo;
  highlightObject(mo.group);

  if (mo.isDoor) {
    // For doors: record where along the wall we grabbed
    const pt = new THREE.Vector3();
    raycaster.ray.intersectPlane(floorPlane, pt);
    const ds = mo.doorState;
    if (ds.wall === 'back' || ds.wall === 'front') dragOffset.set(pt.x - ds.pos, 0, 0);
    else dragOffset.set(0, 0, pt.z - ds.pos);
  } else {
    // Furniture: floor plane drag
    const pt = new THREE.Vector3();
    raycaster.ray.intersectPlane(floorPlane, pt);
    dragOffset.copy(mo.group.position).sub(pt);
    dragOffset.y = 0;
  }
}

function handleFurnitureDragMove(e) {
  if (!dragObject) {
    // hover highlight
    getMouseNDC(e);
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(getAllMovableMeshes());
    if (hits.length) {
      const mo = hits[0].object.userData.movableRef;
      if (mo) showSelectionInfo(mo.group, mo.isDoor ? mo.doorState : null);
    }
    return;
  }

  getMouseNDC(e);
  raycaster.setFromCamera(mouse, camera);

  if (dragObject.isDoor) {
    const ds = dragObject.doorState;
    const pt = new THREE.Vector3();
    raycaster.ray.intersectPlane(floorPlane, pt);

    let wallLen = (ds.wall==='back'||ds.wall==='front') ? ROOM_W : ROOM_D;
    let raw = (ds.wall==='back'||ds.wall==='front') ? pt.x - dragOffset.x : pt.z - dragOffset.z;
    // Clamp so door stays on wall with 2" margin
    ds.pos = Math.max(2, Math.min(wallLen - ds.width - 2, raw));
    placeDoor(ds);
    rebuildWall(ds.wall);

  } else {
    // Furniture floor drag
    const pt = new THREE.Vector3();
    raycaster.ray.intersectPlane(floorPlane, pt);
    const fw = dragObject.group.userData.w || 40;
    const fd = dragObject.group.userData.d || 40;
    dragObject.group.position.x = Math.max(0, Math.min(ROOM_W - fw, pt.x + dragOffset.x));
    dragObject.group.position.z = Math.max(0, Math.min(ROOM_D - fd, pt.z + dragOffset.z));
  }
}

function endFurnitureDrag() {
  dragObject = null;
}

// Wall-change button: cycle a door to the next wall
function cycleDoorWall(ds) {
  const walls = ['back','front','left','right'];
  const idx = walls.indexOf(ds.wall);
  const newWall = walls[(idx+1) % 4];
  const oldWall = ds.wall;
  ds.wall = newWall;
  ds.pos = 10; // reset to safe position
  placeDoor(ds);
  rebuildWall(oldWall);
  rebuildWall(newWall);
}

function highlightObject(group) {
  selectedObject = group;
  showSelectionInfo(group, null);
}

function showSelectionInfo(group, ds) {
  const panel = document.getElementById('selected-info');
  panel.style.display = 'block';
  document.getElementById('sel-name').textContent = ds ? `🚪 ${ds.wall.charAt(0).toUpperCase()+ds.wall.slice(1)} Door` : (group.userData.name || 'Furniture');
  document.getElementById('sel-dims').textContent = ds ? `${ds.width}" wide\nDrag to slide along wall\nClick "Change Wall" to move\nto a different wall` : (group.userData.dims || '');

  // Show/hide change-wall button
  let btn = document.getElementById('change-wall-btn');
  if (ds) {
    if (!btn) {
      btn = document.createElement('button');
      btn.id = 'change-wall-btn';
      btn.textContent = '🔄 Change Wall';
      btn.style.cssText = 'margin-top:8px;background:rgba(100,200,100,0.2);border:1px solid rgba(100,200,100,0.5);color:#aeffae;padding:5px 10px;border-radius:6px;cursor:pointer;font-family:monospace;font-size:11px;width:100%;pointer-events:all;';
      panel.appendChild(btn);
    }
    btn.style.display = 'block';
    btn.onclick = () => {
      const activeDoor = movableObjects.find(mo => mo.isDoor && mo.group === selectedObject);
      if (activeDoor) cycleDoorWall(activeDoor.doorState);
    };
    // Update onclick to use current ds
    btn.onclick = () => cycleDoorWall(ds);
  } else if (btn) {
    btn.style.display = 'none';
  }
}

// ── WALK MOVEMENT ─────────────────────────────────────────────────────────────
const walkDir = new THREE.Vector3();
const walkRight = new THREE.Vector3();
const walkFwd = new THREE.Vector3();

function updateWalk(dt) {
  const speed = keys['ShiftLeft'] || keys['ShiftRight'] ? 80 : 35;
  const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
  const quat = new THREE.Quaternion().setFromEuler(euler);

  walkFwd.set(0, 0, -1).applyQuaternion(quat);
  walkFwd.y = 0; walkFwd.normalize();
  walkRight.set(1, 0, 0).applyQuaternion(quat);
  walkRight.y = 0; walkRight.normalize();

  walkDir.set(0, 0, 0);
  if (keys['KeyW']) walkDir.add(walkFwd);
  if (keys['KeyS']) walkDir.sub(walkFwd);
  if (keys['KeyA']) walkDir.sub(walkRight);
  if (keys['KeyD']) walkDir.add(walkRight);
  if (keys['ArrowUp'])   walkDir.y += 1;
  if (keys['ArrowDown']) walkDir.y -= 1;
  if (walkDir.length() > 0) walkDir.normalize();

  walkPos.addScaledVector(walkDir, speed * dt);
  // Clamp inside room with margin
  walkPos.x = Math.max(5, Math.min(ROOM_W - 5, walkPos.x));
  walkPos.y = Math.max(20, Math.min(ROOM_H - 10, walkPos.y));
  walkPos.z = Math.max(5, Math.min(ROOM_D + 20, walkPos.z));

  camera.position.copy(walkPos);
  camera.rotation.set(pitch, yaw, 0, 'YXZ');
}

// ── ORBIT UPDATE ──────────────────────────────────────────────────────────────
const orbitCenter = new THREE.Vector3(ROOM_W/2, 40, ROOM_D/2);

function updateOrbit() {
  const x = orbitCenter.x + orbitRadius * Math.sin(orbitPhi) * Math.sin(orbitTheta);
  const y = orbitCenter.y + orbitRadius * Math.cos(orbitPhi);
  const z = orbitCenter.z + orbitRadius * Math.sin(orbitPhi) * Math.cos(orbitTheta);
  camera.position.set(x, y, z);
  camera.lookAt(orbitCenter);
}

// ── RENDER LOOP ───────────────────────────────────────────────────────────────
let lastTime = performance.now();

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (mode === 'walk') updateWalk(dt);
  if (mode === 'orbit' || mode === 'move') updateOrbit();
  if (mode === 'top') {
    camera.position.set(ROOM_W/2, 350, ROOM_D/2);
    camera.lookAt(ROOM_W/2, 0, ROOM_D/2);
  }

  renderer.render(scene, camera);
}

animate();

// Start in orbit for first view
setMode('orbit');
orbitRadius = 220; orbitTheta = -0.8; orbitPhi = 0.6;
</script>
