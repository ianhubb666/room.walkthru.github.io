<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>Room 3D — Mobile</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: #0a0a0f; color: #fff; font-family: -apple-system, 'SF Pro Display', sans-serif; overflow: hidden; touch-action: none; user-select: none; }
  #canvas { display: block; touch-action: none; }

  /* ── Top bar ── */
  #top-bar {
    position: fixed; top: 0; left: 0; right: 0; height: 52px;
    background: rgba(8,8,18,0.92); border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px; backdrop-filter: blur(14px); z-index: 100;
  }
  #top-bar h3 { font-size: 14px; font-weight: 600; color: rgba(160,200,255,0.95); letter-spacing: 0.5px; }
  #mode-label-top { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 1px; }

  /* ── Mode tabs at bottom ── */
  #mode-tabs {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(8,8,18,0.95); border-top: 1px solid rgba(255,255,255,0.08);
    display: flex; z-index: 100; backdrop-filter: blur(14px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .tab-btn {
    flex: 1; padding: 10px 4px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: none; color: rgba(255,255,255,0.45);
    font-family: -apple-system, sans-serif; font-size: 9px; font-weight: 500;
    letter-spacing: 0.3px; cursor: pointer; transition: color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .tab-btn .tab-icon { width: 22px; height: 22px; display: block; stroke: currentColor; transition: opacity 0.15s; }
  .tab-btn.active { color: rgba(120,180,255,1); }
  .tab-btn.active .tab-icon { opacity: 1; filter: drop-shadow(0 0 5px rgba(100,160,255,0.6)); }

  /* ── Virtual joystick (walk mode) ── */
  #joystick-zone {
    position: fixed; bottom: 70px; left: 20px;
    width: 120px; height: 120px; z-index: 90; display: none;
  }
  #joystick-base {
    width: 120px; height: 120px; border-radius: 50%;
    background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.15);
    position: relative;
  }
  #joystick-stick {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(120,180,255,0.7); border: 2px solid rgba(160,210,255,0.9);
    box-shadow: 0 0 16px rgba(100,160,255,0.4);
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    transition: none; pointer-events: none;
  }

  /* ── Look touch zone label ── */
  #look-zone-hint {
    position: fixed; bottom: 80px; right: 20px;
    font-size: 10px; color: rgba(255,255,255,0.2);
    pointer-events: none; display: none; text-align: center; line-height: 1.6;
  }

  /* ── Orbit hint ── */
  #orbit-hint {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: rgba(255,255,255,0.3); pointer-events: none;
    display: none; white-space: nowrap;
  }

  /* ── Move mode hint ── */
  #move-hint {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
    background: rgba(255,200,50,0.12); border: 1px solid rgba(255,200,50,0.35);
    color: rgba(255,200,50,0.85); padding: 6px 16px; border-radius: 20px;
    font-size: 11px; pointer-events: none; display: none; white-space: nowrap;
  }

  /* ── Selected object panel ── */
  #selected-info {
    position: fixed; top: 64px; right: 12px;
    background: rgba(8,8,18,0.92); border: 1px solid rgba(100,200,100,0.25);
    border-radius: 12px; padding: 12px 14px; backdrop-filter: blur(14px);
    display: none; min-width: 150px; max-width: 180px; z-index: 90;
  }
  #selected-info h4 { font-size: 12px; color: rgba(100,220,100,0.9); margin-bottom: 4px; }
  #selected-info p { font-size: 10px; color: rgba(255,255,255,0.45); line-height: 1.6; white-space: pre-line; }
  #change-wall-btn {
    margin-top: 8px; background: rgba(100,200,100,0.15);
    border: 1px solid rgba(100,200,100,0.4); color: #aeffae;
    padding: 7px 10px; border-radius: 8px; cursor: pointer;
    font-family: -apple-system, sans-serif; font-size: 11px;
    width: 100%; pointer-events: all; display: none;
  }

  /* ── Crosshair (walk) ── */
  #crosshair {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 18px; height: 18px; pointer-events: none; display: none;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: rgba(255,255,255,0.5);
  }
  #crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
  #crosshair::after  { height: 2px; width: 100%; top: 50%; transform: translateY(-50%); }

  /* ── Zoom pinch hint ── */
  #pinch-hint {
    position: fixed; bottom: 75px; left: 50%; transform: translateX(-50%);
    font-size: 10px; color: rgba(255,255,255,0.2); pointer-events: none;
    display: none; white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<!-- Top bar -->
<div id="top-bar">
  <div>
    <div id="top-bar-title">🏠 Room Tour</div>
    <div id="mode-label-top">Orbit View</div>
  </div>
  <div style="font-size:10px;color:rgba(255,255,255,0.25);text-align:right">12'6" × 9'1"</div>
</div>

<!-- Mode tabs -->
<div id="mode-tabs">
  <button class="tab-btn" id="btn-walk" onclick="setMode('walk')">
    <svg class="tab-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><path d="M12 7v6l-3 4"/><path d="M12 13l3 4"/><path d="M9 11H7"/><path d="M17 11h-2"/></svg>
    Walk
  </button>
  <button class="tab-btn active" id="btn-orbit" onclick="setMode('orbit')">
    <svg class="tab-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="9" ry="3.5" transform="rotate(-35 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="3.5" transform="rotate(35 12 12)"/></svg>
    Orbit
  </button>
  <button class="tab-btn" id="btn-move" onclick="setMode('move')">
    <svg class="tab-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
    Move
  </button>
  <button class="tab-btn" id="btn-top" onclick="setMode('top')">
    <svg class="tab-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
    Top
  </button>
</div>

<!-- Virtual joystick (walk mode) -->
<div id="joystick-zone">
  <div id="joystick-base">
    <div id="joystick-stick"></div>
  </div>
</div>

<!-- Look zone hint (walk) -->
<div id="look-zone-hint">Drag right side to look around</div>

<!-- Orbit hint -->
<div id="orbit-hint">Drag to orbit · Pinch to zoom</div>

<!-- Move hint -->
<div id="move-hint">Tap + drag to move furniture</div>

<!-- Crosshair (walk) -->
<div id="crosshair"></div>

<!-- Pinch hint (orbit) -->
<div id="pinch-hint">Pinch to zoom</div>

<!-- Selected object info -->
<div id="selected-info">
  <h4 id="sel-name">Desk</h4>
  <p id="sel-dims"></p>
  <p style="margin-top:5px;color:rgba(100,220,100,0.6);font-size:9px" id="sel-hint">Tap + drag to move</p>
  <button id="change-wall-btn">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle;margin-right:5px"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
    Change Wall
  </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── CONSTANTS (inches → Three.js units, 1 unit = 1 inch) ──────────────────
const IN = 1;
const ROOM_W = 150.69 * IN;  // 12ft 6.69in
const ROOM_D = 109.22 * IN;  // 9ft 1.22in
const ROOM_H = 96 * IN;
const WALL_T = 4;

// ── SCENE SETUP ──────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 200, 600);

const camera = new THREE.PerspectiveCamera(70, 1, 0.5, 2000);

function resizeRenderer() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
resizeRenderer();
window.addEventListener('resize', resizeRenderer);

// ── MATERIALS ────────────────────────────────────────────────────────────────
const mats = {
  floor:    new THREE.MeshStandardMaterial({ color: 0xc8a96e, roughness: 0.7, metalness: 0.0 }),
  ceiling:  new THREE.MeshStandardMaterial({ color: 0xfafaf8, roughness: 1.0 }),
  desk:     new THREE.MeshStandardMaterial({ color: 0x8b6f47, roughness: 0.5, metalness: 0.1 }),
  deskLeg:  new THREE.MeshStandardMaterial({ color: 0x5c4a3a, roughness: 0.6 }),
  bed:      new THREE.MeshStandardMaterial({ color: 0x5c7a9e, roughness: 0.8 }),
  bedFrame: new THREE.MeshStandardMaterial({ color: 0x3d2b1f, roughness: 0.6 }),
  pillow:   new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 1.0 }),
  closet:   new THREE.MeshStandardMaterial({ color: 0xd4b896, roughness: 0.6 }),
  door:     new THREE.MeshStandardMaterial({ color: 0xe8ddd0, roughness: 0.5 }),
  doorKnob: new THREE.MeshStandardMaterial({ color: 0xd4a843, metalness: 0.9, roughness: 0.1 }),
  trim:     new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8 }),
  selected: new THREE.MeshStandardMaterial({ color: 0x88ddff, roughness: 0.5, metalness: 0.2, emissive: 0x224488 }),
};

// ── WALL MATERIALS ────────────────────────────────────────────────────────────
const wallMatInner = new THREE.MeshStandardMaterial({
  color: 0xf0ece4, roughness: 0.9, metalness: 0.0,
  side: THREE.FrontSide,
});
const wallMatOuter = new THREE.MeshStandardMaterial({
  color: 0xdedad4, roughness: 0.9, metalness: 0.0,
  side: THREE.BackSide,
  transparent: true, opacity: 0.18,
  depthWrite: false,
});
mats.wall = wallMatInner;

// ── HELPERS ──────────────────────────────────────────────────────────────────
function box(w, h, d, mat, castShadow=true, receiveShadow=true) {
  const g = new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Mesh(g, mat);
  m.castShadow = castShadow;
  m.receiveShadow = receiveShadow;
  return m;
}

function wallBox(w, h, d) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const grp = new THREE.Group();
  const inner = new THREE.Mesh(geo, wallMatInner);
  inner.castShadow = true; inner.receiveShadow = true; inner.renderOrder = 0;
  grp.add(inner);
  const outer = new THREE.Mesh(geo, wallMatOuter);
  outer.castShadow = false; outer.receiveShadow = false; outer.renderOrder = 1;
  grp.add(outer);
  return grp;
}

// ── ROOM STRUCTURE ────────────────────────────────────────────────────────────
const roomGroup = new THREE.Group();
scene.add(roomGroup);

// Floor
const floor = box(ROOM_W, WALL_T, ROOM_D, mats.floor, false, true);
floor.position.set(ROOM_W/2, -WALL_T/2, ROOM_D/2);
roomGroup.add(floor);

// Ceiling removed for open-top view

// Back wall (z=0) — fully solid, no door
const wBack = wallBox(ROOM_W, ROOM_H, WALL_T);
wBack.position.set(ROOM_W/2, ROOM_H/2, -WALL_T/2);
roomGroup.add(wBack);

// Front wall (z=ROOM_D)
// Bottom door: x = 20.47..49.47 (2ft5in = 29" wide, starts at closet edge x=20.47)
const DOOR_B_X = 28.47; // 8" gap from closet edge
const DOOR_B_W = 29;    // 2ft 5in
const wFrontLeft = wallBox(DOOR_B_X, ROOM_H, WALL_T);
wFrontLeft.position.set(DOOR_B_X/2, ROOM_H/2, ROOM_D + WALL_T/2);
roomGroup.add(wFrontLeft);
const wFrontRight = wallBox(ROOM_W - DOOR_B_X - DOOR_B_W, ROOM_H, WALL_T);
wFrontRight.position.set(DOOR_B_X + DOOR_B_W + (ROOM_W - DOOR_B_X - DOOR_B_W)/2, ROOM_H/2, ROOM_D + WALL_T/2);
roomGroup.add(wFrontRight);
const wFrontAboveDoor = wallBox(DOOR_B_W, ROOM_H - 84, WALL_T);
wFrontAboveDoor.position.set(DOOR_B_X + DOOR_B_W/2, 84 + (ROOM_H-84)/2, ROOM_D + WALL_T/2);
roomGroup.add(wFrontAboveDoor);

// Left wall (x=0) — full height, closet is built in front of it
const wLeft = wallBox(WALL_T, ROOM_H, ROOM_D);
wLeft.position.set(-WALL_T/2, ROOM_H/2, ROOM_D/2);
roomGroup.add(wLeft);

// Right wall (x=ROOM_W) — door shifted 10" toward bed
const DOOR_R_W = 30;
const DOOR_R_OFFSET = 10;
const wRightCorner = wallBox(WALL_T, ROOM_H, DOOR_R_OFFSET);
wRightCorner.position.set(ROOM_W + WALL_T/2, ROOM_H/2, DOOR_R_OFFSET/2);
roomGroup.add(wRightCorner);
const wRightMain = wallBox(WALL_T, ROOM_H, ROOM_D - DOOR_R_OFFSET - DOOR_R_W);
wRightMain.position.set(ROOM_W + WALL_T/2, ROOM_H/2, DOOR_R_OFFSET + DOOR_R_W + (ROOM_D - DOOR_R_OFFSET - DOOR_R_W)/2);
roomGroup.add(wRightMain);
const wRightAboveDoor = wallBox(WALL_T, ROOM_H - 84, DOOR_R_W);
wRightAboveDoor.position.set(ROOM_W + WALL_T/2, 84 + (ROOM_H-84)/2, DOOR_R_OFFSET + DOOR_R_W/2);
roomGroup.add(wRightAboveDoor);

// Floor trim / baseboard
function baseboard(w, d, x, z) {
  const b = box(w, 4, d, mats.trim);
  b.position.set(x, 2, z);
  roomGroup.add(b);
}
baseboard(ROOM_W, 2, ROOM_W/2, 1);          // back
baseboard(ROOM_W, 2, ROOM_W/2, ROOM_D - 1); // front
baseboard(2, ROOM_D, 1, ROOM_D/2);          // left
baseboard(2, ROOM_D, ROOM_W - 1, ROOM_D/2); // right

// Closet is inset in left wall — open face toward room, no partition wall needed

// ── DOORS — MOVABLE ───────────────────────────────────────────────────────────
// Each door lives on a wall. When dragged in Move Mode it slides along its wall.
// Wall segments rebuild whenever a door moves.

const movableObjects = []; // furniture + doors share the drag system

// Door state: { group, arcMesh, wall:'back'|'front'|'left'|'right', pos: offset along wall, width }
const doorStates = [];

// Wall segment groups — rebuilt on door move
const wallSegs = { back: new THREE.Group(), front: new THREE.Group(), left: new THREE.Group(), right: new THREE.Group() };
Object.values(wallSegs).forEach(g => roomGroup.add(g));

function buildDoorPanel(width) {
  const dg = new THREE.Group();
  dg.userData.isDoor = true;

  // Main panel
  const dp = box(width, 84, 3, mats.door);
  dp.position.set(width/2, 42, 0);
  dg.add(dp);

  // Recessed panels (4 insets)
  const pw = width * 0.38, ph1 = 28, ph2 = 22;
  [[width*0.27,58],[width*0.73,58],[width*0.27,22],[width*0.73,22]].forEach(([x,y],i) => {
    const di = box(pw, i<2?ph1:ph2, 1.8, new THREE.MeshStandardMaterial({color:0xddd0c4,roughness:0.5}));
    di.position.set(x, y, -1.5); dg.add(di);
  });

  // Door frame (top + sides)
  const frameMat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.7});
  const fTop = box(width+6, 4, 4, frameMat); fTop.position.set(width/2, 86, 0); dg.add(fTop);
  const fL   = box(3, 88, 4, frameMat);       fL.position.set(-1.5,  44, 0);    dg.add(fL);
  const fR   = box(3, 88, 4, frameMat);       fR.position.set(width+1.5, 44, 0); dg.add(fR);

  // Knob
  const kn = new THREE.Mesh(new THREE.SphereGeometry(2.2,16,10), mats.doorKnob);
  kn.position.set(width*0.18, 38, -3); dg.add(kn);
  const knBack = new THREE.Mesh(new THREE.SphereGeometry(2.2,16,10), mats.doorKnob);
  knBack.position.set(width*0.18, 38, 3); dg.add(knBack);

  // Highlight overlay (shown when selected/hovered)
  dg.userData.highlightable = true;
  return dg;
}

function buildArc(radius, color=0x88aaff) {
  const geo = new THREE.RingGeometry(2, radius, 48, 1, 0, Math.PI/2);
  const mat = new THREE.MeshBasicMaterial({color, opacity:0.25, transparent:true, side:THREE.DoubleSide});
  const m = new THREE.Mesh(geo, mat);
  m.rotation.x = -Math.PI/2;
  scene.add(m);
  return m;
}

// Rebuild wall segments around doors on that wall
function rebuildWall(wall) {
  const seg = wallSegs[wall];
  while (seg.children.length) seg.remove(seg.children[0]);

  const doors = doorStates.filter(d => d.wall === wall);

  // Wall geometry params
  let wallLen, wallZ, wallX, axis;
  if (wall === 'back')  { wallLen = ROOM_W; wallZ = -WALL_T/2; wallX = 0;      axis = 'x'; }
  if (wall === 'front') { wallLen = ROOM_W; wallZ = ROOM_D+WALL_T/2; wallX = 0; axis = 'x'; }
  if (wall === 'left')  { wallLen = ROOM_D; wallZ = 0; wallX = -WALL_T/2;      axis = 'z'; }
  if (wall === 'right') { wallLen = ROOM_D; wallZ = 0; wallX = ROOM_W+WALL_T/2; axis = 'z'; }

  // Sort doors by position
  const sorted = [...doors].sort((a,b) => a.pos - b.pos);

  // Build solid segments between/around door openings
  let cursor = 0;
  const addSeg = (from, to) => {
    const len = to - from;
    if (len < 0.5) return;
    const s = wallBox(
      axis==='x' ? len : WALL_T,
      ROOM_H,
      axis==='z' ? len : WALL_T
    );
    if (axis === 'x') s.position.set(from + len/2, ROOM_H/2, wallZ);
    else              s.position.set(wallX, ROOM_H/2, from + len/2);
    seg.add(s);
  };
  const addAboveDoor = (from, dw) => {
    const transom = wallBox(
      axis==='x' ? dw : WALL_T,
      ROOM_H - 84,
      axis==='z' ? dw : WALL_T
    );
    if (axis==='x') transom.position.set(from+dw/2, 84+(ROOM_H-84)/2, wallZ);
    else            transom.position.set(wallX, 84+(ROOM_H-84)/2, from+dw/2);
    seg.add(transom);
  };

  sorted.forEach(d => {
    addSeg(cursor, d.pos);
    addAboveDoor(d.pos, d.width);
    cursor = d.pos + d.width;
  });
  addSeg(cursor, wallLen);
}

// Position a door group + arc on its wall
function placeDoor(ds) {
  const { group, arcMesh, wall, pos, width } = ds;
  if (wall === 'back') {
    // Panel local +X = world +X. Door fills x=pos..pos+width
    group.position.set(pos, 0, 0);
    group.rotation.y = 0;
    arcMesh.position.set(pos, 0.5, 2);
    arcMesh.rotation.set(-Math.PI/2, 0, 0);
  } else if (wall === 'front') {
    // Rotated 180°: local +X → world -X. Set origin at pos+width so panel extends left to pos
    group.position.set(pos + width, 0, ROOM_D);
    group.rotation.y = Math.PI;
    // Arc swings inward (toward -z), pivot at left jamb (pos)
    arcMesh.position.set(pos, 0.5, ROOM_D - 2);
    arcMesh.rotation.set(-Math.PI/2, 0, Math.PI/2);
  } else if (wall === 'left') {
    // Rotated +90°: local +X → world +Z. Door fills z=pos..pos+width
    group.position.set(0, 0, pos);
    group.rotation.y = Math.PI/2;
    arcMesh.position.set(2, 0.5, pos);
    arcMesh.rotation.set(-Math.PI/2, 0, -Math.PI/2);
  } else if (wall === 'right') {
    // Rotated -90°: local +X → world -Z. Set origin at z=pos+width, panel extends toward z=pos
    group.position.set(ROOM_W, 0, pos + width);
    group.rotation.y = -Math.PI/2;
    // Arc swings inward (toward -x = into room), pivot at z=pos+width corner
    arcMesh.position.set(ROOM_W - 2, 0.5, pos);
    arcMesh.rotation.set(-Math.PI/2, 0, Math.PI);
  }
}

function createDoor(wall, pos, width, arcColor) {
  const group = buildDoorPanel(width);
  scene.add(group);

  const arcMesh = buildArc(width, arcColor);

  const ds = { group, arcMesh, wall, pos, width };
  doorStates.push(ds);
  movableObjects.push({ group, isDoor: true, doorState: ds });

  // Tag all meshes
  group.traverse(child => {
    if (child.isMesh) child.userData.movableRef = movableObjects[movableObjects.length-1];
  });

  placeDoor(ds);
  rebuildWall(wall);
  return ds;
}

// Front wall door
createDoor('front', DOOR_B_X, DOOR_B_W, 0x88ffaa);

  lumbar.position.set(0, 25, -9.5); g.add(lumbar);
  const headrest = box(12, 8, 2.5, chairFabric);
  headrest.position.set(0, 50, -9); g.add(headrest);
  const col = box(2, 14, 3, chairPlastic);
  col.position.set(0, 22, -9.5); g.add(col);

  // Armrests
  [-9, 9].forEach(ox => {
    const armH = box(2, 8, 2, chairPlastic);
    armH.position.set(ox, 22, 0); g.add(armH);
    const armPad = box(2, 1.5, 9, new THREE.MeshStandardMaterial({color:0x222222, roughness:0.9}));
    armPad.position.set(ox, 26.5, 3); g.add(armPad);
  });

  // Pneumatic cylinder
  const cylGeo = new THREE.CylinderGeometry(1.2, 1.8, 12, 10);
  const cyl = new THREE.Mesh(cylGeo, chromeMat);
  cyl.position.set(0, 10, 0); g.add(cyl);

  // 5-star base + casters
  for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI * 2;
    const arm = box(14, 1.2, 2, chairPlastic);
    arm.position.set(Math.cos(angle)*7, 2.5, Math.sin(angle)*7);

    g.add(wheel);
  }

  return g;
}

function createCloset() {
  const g = new THREE.Group();
  // Full left wall length: CW=20.47" deep, CH=80.14" tall, CD=ROOM_D long
  const CW = 20.47, CH = 80.14, CD = ROOM_D;
  g.userData = { name: 'Closet', dims: `${CW.toFixed(1)}" deep × full wall`, w: CW, d: CD, fixed: true };

  const woodMat     = mats.closet;
  const interiorMat = new THREE.MeshStandardMaterial({ color: 0xede0d0, roughness: 0.9 });
  const trackMat    = new THREE.MeshStandardMaterial({ color: 0xbbbbbb, metalness: 0.8, roughness: 0.2 });
  const doorMat     = new THREE.MeshStandardMaterial({ color: 0xe8ddd0, roughness: 0.3, metalness: 0.05 });

  // ── Interior shell ───────────────────────────────────────────────────────────
  // Back panel (against left wall)
  const backPanel = box(2, CH, CD, interiorMat);
  backPanel.position.set(CW - 1, CH/2, CD/2);
  g.add(backPanel);

  // Top (ceiling of closet)
  const topPanel = box(CW, 2, CD, woodMat);
  topPanel.position.set(CW/2, CH, CD/2);
  g.add(topPanel);

  // Floor strip
  const floorPanel = box(CW, 1.5, CD, woodMat);
  floorPanel.position.set(CW/2, 0.75, CD/2);
  g.add(floorPanel);

  // End caps (z=0 and z=CD)
  const capBack = box(CW, CH, 2, interiorMat);
  capBack.position.set(CW/2, CH/2, 1);
  g.add(capBack);
  const capFront = box(CW, CH, 2, interiorMat);
  capFront.position.set(CW/2, CH/2, CD - 1);
  g.add(capFront);

  // ── Interior fittings ────────────────────────────────────────────────────────
  // Upper shelf running full length
  const shelf = box(CW - 2, 2, CD - 6, woodMat);
  shelf.position.set(CW/2, CH * 0.82, CD/2);
  g.add(shelf);

  // Hanging rod full length
  const rodGeo = new THREE.CylinderGeometry(0.9, 0.9, CD - 10, 12);
  const rod = new THREE.Mesh(rodGeo, trackMat);
  rod.rotation.x = Math.PI/2;
  rod.position.set(CW/2, CH * 0.72, CD/2);
  g.add(rod);

  // Hanging clothes evenly spaced
  const clothColors = [0x8a6a8a,0x6a8a6a,0x8a8a6a,0x6a6a8a,0x9a6a6a,0x7a8a9a,0xaa8a7a,0x7aaa8a,0x8a9aaa,0xaa9a7a,0x7a8a9a,0x9a7aaa];
  const numClothes = 12;
  for (let i = 0; i < numClothes; i++) {
    const hanger = box(2.5, 20, 1.5, new THREE.MeshStandardMaterial({ color: clothColors[i % clothColors.length], roughness: 0.9 }));
    hanger.position.set(CW * 0.5, CH * 0.58, 8 + i * ((CD - 16) / numClothes));
    g.add(hanger);
  }

  // ── Sliding bypass track doors — 4 panels covering full CD length ────────────
  // Top track rail
  const trackTop = box(3, 3, CD, trackMat);
  trackTop.position.set(CW + 1.5, CH - 1, CD/2);
  g.add(trackTop);
  // Bottom track rail
  const trackBot = box(3, 2.5, CD, trackMat);
  trackBot.position.set(CW + 1.5, 2, CD/2);
  g.add(trackBot);

  // 4 sliding panels, two pairs on bypass tracks, each covering CD/4
  const panelW = CD / 4;
  const tracks = [1, 2.8, 1, 2.8]; // alternating track depth offset
  const offsets = [0, 1, 2, 3];    // which quarter

  offsets.forEach((qi, i) => {
    const zCenter = panelW * qi + panelW / 2;
    const tOff = tracks[i];

    const fabricMat = new THREE.MeshStandardMaterial({color:0x1e1a18,roughness:1.0,metalness:0.0});
    const panel = box(1.8, CH - 6, panelW - 1.5, fabricMat);
    panel.position.set(CW + tOff, CH/2 - 2, zCenter);
    g.add(panel);

    // Vertical frame edges
    const fMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 });
    const fL = box(2, CH - 6, 2, fMat);
    fL.position.set(CW + tOff, CH/2 - 2, panelW * qi + 1.5);
    g.add(fL);
    const fR = box(2, CH - 6, 2, fMat);
    fR.position.set(CW + tOff, CH/2 - 2, panelW * (qi + 1) - 1.5);
    g.add(fR);

    // Horizontal bar handle
    const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 16, 8), trackMat);
    handle.rotation.x = Math.PI / 2;
    handle.position.set(CW + tOff + 1.8, CH * 0.5, zCenter);
    g.add(handle);
  });

  return g;
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + m).classList.add('active');
  document.getElementById('mode-label-top').textContent =
    { walk:'Walk Mode', orbit:'Orbit View', move:'Move Furniture', top:'Top View' }[m];

  document.getElementById('joystick-zone').style.display  = m === 'walk'  ? 'block' : 'none';
  document.getElementById('look-zone-hint').style.display = m === 'walk'  ? 'block' : 'none';
  document.getElementById('orbit-hint').style.display     = m === 'orbit' ? 'block' : 'none';
  document.getElementById('move-hint').style.display      = m === 'move'  ? 'block' : 'none';
  document.getElementById('crosshair').style.display      = m === 'walk'  ? 'block' : 'none';
  document.getElementById('pinch-hint').style.display     = m === 'orbit' ? 'block' : 'none';

  if (m === 'walk') camera.position.copy(walkPos);
  if (m === 'top') { camera.position.set(ROOM_W/2, 350, ROOM_D/2); camera.lookAt(ROOM_W/2, 0, ROOM_D/2); }
}

// Drag system for move mode
const raycaster = new THREE.Raycaster();
const mouse     = new THREE.Vector2();
let dragObject  = null;
let dragOffset  = new THREE.Vector3();
let selectedObject = null;
const floorPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);

function getTouchNDC(touch) {
  mouse.x =  (touch.clientX / window.innerWidth)  * 2 - 1;
  mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;
}

function getAllMovableMeshes() {
  const meshes = [];
  movableObjects.forEach(mo => {
    mo.group.traverse(child => {
      if (child.isMesh) { child.userData.movableRef = mo; meshes.push(child); }
    });
  });
  return meshes;
}

// ── TOUCH HANDLERS ────────────────────────────────────────────────────────────
canvas.addEventListener('touchstart', onTouchStart, { passive: false });
canvas.addEventListener('touchmove',  onTouchMove,  { passive: false });
canvas.addEventListener('touchend',   onTouchEnd,   { passive: false });
canvas.addEventListener('touchcancel',onTouchEnd,   { passive: false });

function onTouchStart(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });

    if (mode === 'walk') {
      const halfW = window.innerWidth / 2;
      if (t.clientX < halfW && joystickTouchId === null) {
        // Left half → joystick
        joystickTouchId = t.identifier;
        const c = getJoyCenterScreen();
        joyBaseX = c.x; joyBaseY = c.y;
      } else if (t.clientX >= halfW && lookTouchId === null) {
        // Right half → look
        lookTouchId = t.identifier;
      }

    } else if (mode === 'orbit') {
      const ids = [...activeTouches.keys()];
      if (ids.length === 2) {
        pinchTouchIds = ids;
        const t0 = activeTouches.get(ids[0]);
        const t1 = activeTouches.get(ids[1]);
        if (t0 && t1) lastPinchDist = Math.hypot(t1.x-t0.x, t1.y-t0.y);
      } else if (orbitTouchId === null) {
        orbitTouchId = t.identifier;
      }

    } else if (mode === 'move') {
      getTouchNDC(t);
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(getAllMovableMeshes());
      if (hits.length) {
        const mo = hits[0].object.userData.movableRef;
        if (mo) {
          dragObject = mo;
          showSelectionInfo(mo.group, mo.isDoor ? mo.doorState : null);
          const pt = new THREE.Vector3();
          raycaster.ray.intersectPlane(floorPlane, pt);
          if (mo.isDoor) {
            const ds = mo.doorState;
            dragOffset.set(
              (ds.wall==='back'||ds.wall==='front') ? pt.x - ds.pos : 0,
              0,
              (ds.wall==='left'||ds.wall==='right') ? pt.z - ds.pos : 0
            );
          } else {
            dragOffset.copy(mo.group.position).sub(pt); dragOffset.y = 0;
          }
        }
      }
    }
  }
}

function onTouchMove(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const prev = activeTouches.get(t.identifier);
    if (!prev) continue;
    const dx = t.clientX - prev.x;
    const dy = t.clientY - prev.y;
    activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });

    if (mode === 'walk') {
      if (t.identifier === joystickTouchId) {
        const c = getJoyCenterScreen();
        const ox = t.clientX - c.x, oy = t.clientY - c.y;
        const dist = Math.min(Math.hypot(ox, oy), JOY_R);
        const angle = Math.atan2(oy, ox);
        joyVec.x = Math.cos(angle) * dist / JOY_R;
        joyVec.y = Math.sin(angle) * dist / JOY_R;
        joyStick.style.transform = `translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px))`;
      } else if (t.identifier === lookTouchId) {
        yaw   -= dx * 0.004;
        pitch -= dy * 0.004;
        pitch = Math.max(-1.2, Math.min(1.2, pitch));
      }

    } else if (mode === 'orbit') {
      const ids = [...activeTouches.keys()];
      if (ids.length >= 2 && pinchTouchIds.length === 2) {
        const t0 = activeTouches.get(pinchTouchIds[0]);
        const t1 = activeTouches.get(pinchTouchIds[1]);
        if (t0 && t1) {
          const dist = Math.hypot(t1.x-t0.x, t1.y-t0.y);
          orbitRadius -= (dist - lastPinchDist) * 0.8;
          orbitRadius = Math.max(40, Math.min(450, orbitRadius));
          lastPinchDist = dist;
        }
      } else if (t.identifier === orbitTouchId) {
        orbitTheta -= dx * 0.012;
        orbitPhi   -= dy * 0.012;
        orbitPhi = Math.max(0.05, Math.min(Math.PI/2 - 0.05, orbitPhi));
      }

    } else if (mode === 'move' && dragObject) {
      getTouchNDC(t);
      raycaster.setFromCamera(mouse, camera);
      const pt = new THREE.Vector3();
      raycaster.ray.intersectPlane(floorPlane, pt);
      if (dragObject.isDoor) {
        const ds = dragObject.doorState;
        const wallLen = (ds.wall==='back'||ds.wall==='front') ? ROOM_W : ROOM_D;
        const raw = (ds.wall==='back'||ds.wall==='front') ? pt.x - dragOffset.x : pt.z - dragOffset.z;
        ds.pos = Math.max(2, Math.min(wallLen - ds.width - 2, raw));
        placeDoor(ds); rebuildWall(ds.wall);
      } else {
        const fw = dragObject.group.userData.w || 40;
        const fd = dragObject.group.userData.d || 40;
        dragObject.group.position.x = Math.max(0, Math.min(ROOM_W-fw, pt.x + dragOffset.x));
        dragObject.group.position.z = Math.max(0, Math.min(ROOM_D-fd, pt.z + dragOffset.z));
      }
    }
  }
}

function onTouchEnd(e) {
  for (const t of e.changedTouches) {
    activeTouches.delete(t.identifier);
    if (t.identifier === joystickTouchId) {
      joystickTouchId = null;
      joyVec = { x:0, y:0 };
      joyStick.style.transform = 'translate(-50%, -50%)';
    }
    if (t.identifier === lookTouchId)  lookTouchId  = null;
    if (t.identifier === orbitTouchId) orbitTouchId = null;
    pinchTouchIds = pinchTouchIds.filter(id => id !== t.identifier);
    if (e.changedTouches.length) dragObject = null;
  }
  if (activeTouches.size === 0) { dragObject = null; }
}

// ── KEYBOARD FALLBACK (for desktop testing) ───────────────────────────────────
document.addEventListener('keydown', (e) => { keys[e.code] = true; });
document.addEventListener('keyup',   (e) => { keys[e.code] = false; });
document.addEventListener('keydown', (e) => { if (e.code === 'KeyR') resetCamera(); });

// Mouse orbit fallback
let mouseOrbitActive = false;
canvas.addEventListener('mousedown', (e) => {
  if (mode === 'orbit') mouseOrbitActive = true;
  if (mode === 'move')  startMouseDrag(e);
});
canvas.addEventListener('mousemove', (e) => {
  if (mode === 'orbit' && mouseOrbitActive) {
    orbitTheta -= e.movementX * 0.008;
    orbitPhi   -= e.movementY * 0.008;
    orbitPhi = Math.max(0.05, Math.min(Math.PI/2 - 0.05, orbitPhi));
  }
  if (mode === 'move') handleMouseDragMove(e);
});
canvas.addEventListener('mouseup',   () => { mouseOrbitActive = false; if (mode === 'move') dragObject = null; });
canvas.addEventListener('wheel', (e) => {
  if (mode === 'orbit') { orbitRadius += e.deltaY * 0.5; orbitRadius = Math.max(40, Math.min(450, orbitRadius)); }
});

function startMouseDrag(e) {
  mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(getAllMovableMeshes());
  if (!hits.length) return;
  const mo = hits[0].object.userData.movableRef;
  if (!mo) return;
  dragObject = mo;
  showSelectionInfo(mo.group, mo.isDoor ? mo.doorState : null);
  const pt = new THREE.Vector3(); raycaster.ray.intersectPlane(floorPlane, pt);
  if (mo.isDoor) {
    const ds = mo.doorState;
    dragOffset.set((ds.wall==='back'||ds.wall==='front') ? pt.x-ds.pos : 0, 0, (ds.wall==='left'||ds.wall==='right') ? pt.z-ds.pos : 0);
  } else { dragOffset.copy(mo.group.position).sub(pt); dragOffset.y = 0; }
}
function handleMouseDragMove(e) {
  if (!dragObject) return;
  mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const pt = new THREE.Vector3(); raycaster.ray.intersectPlane(floorPlane, pt);
  if (dragObject.isDoor) {
    const ds = dragObject.doorState;
    const wallLen = (ds.wall==='back'||ds.wall==='front') ? ROOM_W : ROOM_D;
    const raw = (ds.wall==='back'||ds.wall==='front') ? pt.x-dragOffset.x : pt.z-dragOffset.z;
    ds.pos = Math.max(2, Math.min(wallLen-ds.width-2, raw));
    placeDoor(ds); rebuildWall(ds.wall);
  } else {
    const fw = dragObject.group.userData.w || 40, fd = dragObject.group.userData.d || 40;
    dragObject.group.position.x = Math.max(0, Math.min(ROOM_W-fw, pt.x+dragOffset.x));
    dragObject.group.position.z = Math.max(0, Math.min(ROOM_D-fd, pt.z+dragOffset.z));
  }
}

function resetCamera() {
  if (mode === 'walk') { walkPos.set(75, 60, 60); yaw = 0; pitch = 0; }
  if (mode === 'orbit') { orbitRadius = 220; orbitTheta = -0.8; orbitPhi = 0.6; }
}

function showSelectionInfo(group, ds) {
  const panel = document.getElementById('selected-info');
  panel.style.display = 'block';
  document.getElementById('sel-name').textContent = ds
    ? `🚪 ${ds.wall.charAt(0).toUpperCase()+ds.wall.slice(1)} Door`
    : (group.userData.name || 'Furniture');
  document.getElementById('sel-dims').textContent = ds
    ? `${ds.width}" wide\nDrag to slide along wall`
    : (group.userData.dims || '');
  const btn = document.getElementById('change-wall-btn');
  if (ds) { btn.style.display = 'block'; btn.onclick = () => cycleDoorWall(ds); }
  else      btn.style.display = 'none';
}

function cycleDoorWall(ds) {
  const walls = ['back','front','left','right'];
  const oldWall = ds.wall;
  ds.wall = walls[(walls.indexOf(oldWall)+1) % 4];
  ds.pos = 10;
  placeDoor(ds); rebuildWall(oldWall); rebuildWall(ds.wall);
}

// ── WALK MOVEMENT ─────────────────────────────────────────────────────────────
const walkDir = new THREE.Vector3();
const walkFwdV = new THREE.Vector3();
const walkRightV = new THREE.Vector3();

function updateWalk(dt) {
  const speed = 40;
  const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
  const quat  = new THREE.Quaternion().setFromEuler(euler);
  walkFwdV.set(0,0,-1).applyQuaternion(quat); walkFwdV.y = 0; walkFwdV.normalize();
  walkRightV.set(1,0,0).applyQuaternion(quat); walkRightV.y = 0; walkRightV.normalize();

  walkDir.set(0,0,0);
  // Touch joystick
  if (joyVec.x !== 0 || joyVec.y !== 0) {
    walkDir.addScaledVector(walkFwdV,  -joyVec.y);
    walkDir.addScaledVector(walkRightV, joyVec.x);
  }
  // Keyboard fallback
  if (keys['KeyW']) walkDir.add(walkFwdV);
  if (keys['KeyS']) walkDir.sub(walkFwdV);
  if (keys['KeyA']) walkDir.sub(walkRightV);
  if (keys['KeyD']) walkDir.add(walkRightV);
  if (keys['ArrowUp'])   walkDir.y += 1;
  if (keys['ArrowDown']) walkDir.y -= 1;
  if (walkDir.length() > 0) walkDir.normalize();
  walkPos.addScaledVector(walkDir, speed * dt);
  walkPos.x = Math.max(5, Math.min(ROOM_W - 5, walkPos.x));
  walkPos.y = Math.max(20, Math.min(ROOM_H - 10, walkPos.y));
  walkPos.z = Math.max(5, Math.min(ROOM_D + 20, walkPos.z));
  camera.position.copy(walkPos);
  camera.rotation.set(pitch, yaw, 0, 'YXZ');
}

// ── ORBIT UPDATE ──────────────────────────────────────────────────────────────
const orbitCenter = new THREE.Vector3(ROOM_W/2, 40, ROOM_D/2);
function updateOrbit() {
  const x = orbitCenter.x + orbitRadius * Math.sin(orbitPhi) * Math.sin(orbitTheta);
  const y = orbitCenter.y + orbitRadius * Math.cos(orbitPhi);
  const z = orbitCenter.z + orbitRadius * Math.sin(orbitPhi) * Math.cos(orbitTheta);
  camera.position.set(x, y, z);
  camera.lookAt(orbitCenter);
}

// ── RENDER LOOP ───────────────────────────────────────────────────────────────
let lastTime = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt  = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  if (mode === 'walk') updateWalk(dt);
  if (mode === 'orbit' || mode === 'move') updateOrbit();
  if (mode === 'top') {
    camera.position.set(ROOM_W/2, 350, ROOM_D/2);
    camera.lookAt(ROOM_W/2, 0, ROOM_D/2);
  }
  renderer.render(scene, camera);
}
animate();
setMode('orbit');
</script>
